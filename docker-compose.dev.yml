services:
  db:
    image: postgres:16-alpine
    container_name: atomlet-db
    environment:
      POSTGRES_USER: atomlet
      POSTGRES_PASSWORD: atomlet_dev_pw
      POSTGRES_DB: atomlet
      TZ: Asia/Shanghai
    ports: ['55432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atomlet -d atomlet']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
