services:
  db:
    image: postgres:16-alpine
    container_name: atomlet-db
    environment:
      POSTGRES_USER: atomlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atomlet_dev_pw}
      POSTGRES_DB: atomlet
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atomlet -d atomlet']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    container_name: atomlet-web
    environment:
      DATABASE_URL: postgres://atomlet:${POSTGRES_PASSWORD:-atomlet_dev_pw}@db:5432/atomlet
    env_file: .env
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/healthz']
      interval: 15s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
